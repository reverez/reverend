# Reverend's local SearXNG profile.
# The host-side helper binds the container to 127.0.0.1 only and supplies
# SEARXNG_SECRET dynamically, so this file contains no credential.

use_default_settings: true

general:
  debug: false
  instance_name: "Reverend Search"

search:
  safe_search: 1
  default_lang: "en"
  formats:
    - html
    - json

server:
  limiter: false
  public_instance: false
  image_proxy: false
