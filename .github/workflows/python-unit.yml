name: Python unit checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REVEREND_VAULT: ${{ github.workspace }}/.ci-vault
      REVEREND_TEMPLATE: ${{ github.workspace }}/.ci-vault/Master Note Template v20.md
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect documentation-only pull request
        id: changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")"
          docs_only=true
          while IFS= read -r file; do
            test -n "$file" || continue
            case "$file" in
              *.md) ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done <<< "$changed_files"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$changed_files"
      - name: Branch hygiene
        run: |
          git diff --check
          test -z "$(git status --short)"
      - name: Documentation sanity
        if: github.event_name == 'pull_request' && steps.changes.outputs.docs_only == 'true'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | grep -qx 'README.md'; then
            grep -Fq 'Reverend 0.4.0' README.md
          fi
      - uses: actions/setup-python@v5
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs_only != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs_only != 'true'
        run: python -m pip install -e ".[dev]"
      - name: Create portable template fixture
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs_only != 'true'
        run: |
          mkdir -p "$REVEREND_VAULT"
          printf '# CI Master Note Template\n' > "$REVEREND_TEMPLATE"
      - name: Compile vNext Python modules
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs_only != 'true'
        run: |
          python -m py_compile \
            src/reverend/intelligence/evidence.py \
            src/reverend/intelligence/runtime.py \
            src/reverend/intelligence/understanding.py \
            src/reverend/intelligence/failure_investigator.py \
            src/reverend/autonomy.py \
            src/reverend/controlplane/view.py \
            src/reverend/research/search.py \
            src/reverend/research/quality.py \
            src/reverend/research/search_worker.py \
            src/reverend/research/image_worker.py \
            src/reverend/research/service.py \
            src/reverend/runtime/models.py \
            src/reverend/runtime/scheduler.py \
            src/reverend/codeintel/python.py \
            src/reverend/codeintel/graph.py \
            src/reverend/codeintel/retrieval.py \
            src/reverend/knowledge.py \
            src/reverend/benchmarks/reference_fabric.py \
            src/reverend/benchmarks/research_quality.py \
            src/reverend/benchmarks/m10_validation.py \
            src/reverend/benchmarks/m_vnext_07_validation.py \
            src/reverend/benchmarks/m11_validation.py \
            src/reverend/benchmarks/m12_validation.py \
            src/reverend/benchmarks/m13_sandbox_validation.py \
            src/reverend/benchmarks/m13_validation.py \
            src/reverend/benchmarks/runtime.py \
            src/reverend/benchmarks/m14_validation.py \
            src/reverend/benchmarks/release.py \
            src/reverend/benchmarks/m15_validation.py \
            src/reverend/benchmarks/m16_validation.py \
            src/reverend/benchmarks/m17_validation.py \
            src/reverend/benchmarks/m18_validation.py \
            src/reverend/benchmarks/final_validation.py \
            src/reverend/benchmarks/codeintel.py \
            src/reverend/benchmarks/workers.py \
            src/reverend/workers.py \
            src/reverend/development/engine.py \
            src/reverend/development/command.py \
            src/reverend/development/commands.py \
            src/reverend/development/projects.py \
            src/reverend/development/sandbox.py \
            src/reverend/workstation/store.py \
            src/reverend/workstation/task_state.py \
            src/reverend/workstation/context.py \
            src/reverend/workstation/presentation.py \
            src/reverend/workstation/agent_loop.py \
            src/reverend/workstation/verification.py \
            src/reverend/workstation/service.py \
            src/reverend/benchmarks/workstation.py
      - name: Validate shell helpers
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs_only != 'true'
        run: |
          bash -n scripts/reverend-searxng
      - name: Validate UI JavaScript
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs_only != 'true'
        run: |
          node --check src/reverend/ui/app.js
          node --check src/reverend/ui/sources.js
          node --check src/reverend/ui/diagrams.js
          node - <<'NODE'
          const d=require('./src/reverend/ui/diagrams.js');
          const spec=d.parseReverendDiagram('flowchart LR\nA[Start] --> B{Check}\nB -->|yes| C[Done]');
          if(spec.direction!=='LR'||spec.nodes.length!==3||spec.edges.length!==2)process.exit(1);
          let rejected=false;
          try{d.parseReverendDiagram('sequenceDiagram\nA->>B: hello');}catch(_){rejected=true;}
          if(!rejected)process.exit(1);
          NODE
      - name: Targeted unit tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs_only != 'true'
        run: |
          python -m pytest -q \
            tests/test_codeintel_graph.py \
            tests/test_codeintel_retrieval.py \
            tests/test_codeintel_context.py \
            tests/test_benchmark_codeintel.py \
            tests/test_intelligence_evidence.py \
            tests/test_research_quality.py \
            tests/test_benchmark_research_quality.py \
            tests/test_intelligence_routing.py \
            tests/test_intelligence_runtime.py \
            tests/test_m_vnext_07_failure_investigator.py \
            tests/test_public_research.py \
            tests/test_cli_research.py \
            tests/test_searxng_deployment.py \
            tests/test_runtime_models.py \
            tests/test_runtime_scheduler.py \
            tests/test_benchmark_runtime.py \
            tests/test_m14_validation.py \
            tests/test_release_identity.py \
            tests/test_release_smoke.py \
            tests/test_m15_validation.py \
            tests/test_m16_validation.py \
            tests/test_m17_validation.py \
            tests/test_m18_validation.py \
            tests/test_final_validation.py \
            tests/test_workstation_ui_contract.py \
            tests/test_knowledge.py \
            tests/test_reference_fabric_benchmark.py \
            tests/test_m10_validation.py \
            tests/test_m11_validation.py \
            tests/test_m12_validation.py \
            tests/test_m13_sandbox_validation.py \
            tests/test_m13_validation.py \
            tests/test_workers.py \
            tests/test_benchmark_workers.py \
            tests/test_development_coder.py \
            tests/test_development_engine.py \
            tests/test_development_command.py \
            tests/test_development_commands.py \
            tests/test_development_projects.py \
            tests/test_development_sandbox.py \
            tests/test_workstation_privacy.py \
            tests/test_workstation_task_state.py \
            tests/test_workstation_requirements.py \
            tests/test_workstation_presentation.py \
            tests/test_workstation_verification.py \
            tests/test_workstation_continuation.py \
            tests/test_workstation_agent_loop.py \
            tests/test_workstation_context_v2.py \
            tests/test_reference.py \
            tests/test_retrieve.py \
            tests/test_workstation.py \
            tests/test_benchmark_workstation.py \
            tests/test_m16_benchmark_catalog.py \
            tests/test_m17_benchmark_catalog.py
      - name: ResearchBench RQ1
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs_only != 'true'
        run: python -m reverend.benchmarks.research_quality
      - name: Full unit suite
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs_only != 'true'
        run: python -m pytest -q
      - name: Clean package and startup release smoke
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs_only != 'true'
        run: python -m reverend.benchmarks.release .
      - name: M16 portable validation contract
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs_only != 'true'
        run: |
          set +e
          python -m reverend.benchmarks.m16_validation \
            --repository . \
            --skip-tests \
            --skip-live \
            --report-root "$RUNNER_TEMP/m16-validation"
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])/"m16-validation"
          reports=sorted(root.glob("validation-*.json"))
          assert reports, "M16 portable validation report was not written"
          summary=json.loads(reports[-1].read_text(encoding="utf-8"))
          assert summary["portable_ok"] is True
          assert summary["live_ok"] is False
          assert summary["overall_ok"] is False
          assert summary["live_workstation"]["skipped"] is True
          assert summary["live_strong_code"]["skipped"] is True
          PY
      - name: M17 portable validation contract
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs_only != 'true'
        run: |
          set +e
          python -m reverend.benchmarks.m17_validation \
            --repository . \
            --skip-tests \
            --skip-live \
            --report-root "$RUNNER_TEMP/m17-validation"
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])/"m17-validation"
          reports=sorted(root.glob("validation-*.json"))
          assert reports, "M17 portable validation report was not written"
          summary=json.loads(reports[-1].read_text(encoding="utf-8"))
          assert summary["portable_ok"] is True
          assert summary["live_ok"] is False
          assert summary["overall_ok"] is False
          assert summary["live_search"]["skipped"] is True
          PY

      - name: M18 portable validation contract
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs_only != 'true'
        run: |
          set +e
          python -m reverend.benchmarks.m18_validation \
            --repository . \
            --skip-tests \
            --skip-live \
            --report-root "$RUNNER_TEMP/m18-validation"
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])/"m18-validation"
          reports=sorted(root.glob("validation-*.json"))
          assert reports, "M18 portable validation report was not written"
          summary=json.loads(reports[-1].read_text(encoding="utf-8"))
          assert summary["portable_ok"] is True
          assert summary["live_ok"] is False
          assert summary["overall_ok"] is False
          assert summary["live_visual"]["skipped"] is True
          PY

      - name: Final portable programme validation
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs_only != 'true'
        run: |
          set +e
          python -m reverend.benchmarks.final_validation \
            --repository . \
            --skip-tests \
            --skip-live \
            --report-root "$RUNNER_TEMP/final-validation"
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root=Path(os.environ["RUNNER_TEMP"])/"final-validation"
          reports=sorted(root.glob("final-validation-*.json"))
          assert reports, "Final portable validation report was not written"
          summary=json.loads(reports[-1].read_text(encoding="utf-8"))
          assert summary["portable_ok"] is True
          assert summary["live_ok"] is False
          assert summary["overall_ok"] is False
          assert set(summary["milestones"])=={"M16","M17","M18"}
          assert all(
              summary["milestones"][name]["portable_ok"] is True
              for name in ("M16","M17","M18")
          )
          assert len(summary["remaining_gates"])==3
          PY
