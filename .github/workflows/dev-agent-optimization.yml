name: Development agent optimization checks

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/reverend/development/**"
      - "src/reverend/benchmarks/codingbench.py"
      - "tests/test_development_*.py"
      - "tests/test_codingbench.py"
      - "docs/dev-agent-optimization.md"
      - ".github/workflows/dev-agent-optimization.yml"

permissions:
  contents: read

jobs:
  development-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Repository hygiene
        run: |
          git diff --check
          test -z "$(git status --short)"
      - name: Development and code-intelligence tests
        run: |
          python -m pytest -q \
            tests/test_development_coder.py \
            tests/test_development_engine.py \
            tests/test_development_implementation_model.py \
            tests/test_development_repair.py \
            tests/test_development_repair_model.py \
            tests/test_development_verifier.py \
            tests/test_development_verification.py \
            tests/test_development_edits.py \
            tests/test_development_worktrees.py \
            tests/test_development_localization.py \
            tests/test_development_acceptance.py \
            tests/test_codeintel_graph.py \
            tests/test_codeintel_retrieval.py \
            tests/test_codeintel_context.py \
            tests/test_codingbench.py
      - name: CodingBench legacy localization baseline
        run: |
          python -m reverend.benchmarks.codingbench \
            --strategy legacy \
            --self-host \
            --repository .
      - name: CodingBench optimized localization
        run: |
          python -m reverend.benchmarks.codingbench \
            --strategy optimized \
            --self-host \
            --repository .
